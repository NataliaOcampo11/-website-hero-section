<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoverChair</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-heading">
      <img class="hero-image" src="./chair.png" alt="HoverChair">

      <h1 id="hero-heading">HoverChair</h1>
      <p class="subheading">Make room for a moment of calm.</p>
      <p class="description">
        A chair for the quieter parts of your day, from the first sip
        of coffee to the last chapter before bed.
      </p>

      <a class="button" href="#about">Explore HoverChair</a>
    </section>

    <section class="overview" id="about" aria-labelledby="about-heading">
      <h2 id="about-heading">Find your favorite spot</h2>
      <p>
        Picture HoverChair beside a sunny window, next to a stack of books,
        or in a corner you’ve made your own.
      </p>
    </section>
  </main>
</body>
</html>
